<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Monthly Budget</title>
</head>
<body>

  <h2>Monatliches Budget</h2>

  <!-- Eingabe -->
  <input type="text" id="description" placeholder="Beschreibung">
  <input type="number" id="amount" placeholder="Betrag">
  <button onclick="addEntry()">Hinzufügen</button>

  <!-- Tabelle -->
  <table border="1" id="budgetTable">
    <thead>
      <tr>
        <th>Beschreibung</th>
        <th>Betrag</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadTable() {
      let res = await fetch("http://127.0.0.1:5000/list");
      let data = await res.json();

      let tbody = document.querySelector("#budgetTable tbody");
      tbody.innerHTML = "";

      data.forEach(entry => {
        let row = `<tr><td>${entry.description}</td><td>${entry.amount}</td></tr>`;
        tbody.innerHTML += row;
      });
    }

    async function addEntry() {
      let description = document.getElementById("description").value;
      let amount = document.getElementById("amount").value;

      await fetch("http://127.0.0.1:5000/add", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({description, amount})
      });

      loadTable();
    }

    // Beim Laden direkt Tabelle füllen
    loadTable();
  </script>

</body>
</html>
