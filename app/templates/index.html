<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <title>B.U.D.G.E.T. - Dashboard</title>

</head>
<body>

    {% include 'components/navbar.html' %}

    <a href="{{ url_for('dashboard.changelog') }}" class="version-badge{% if not version %} version-badge--error{% endif %}" title="Neuerungen & Changelog anzeigen">
        <span class="version-badge__icon">i</span>
        <span class="version-badge__label">{% if version %}v{{ version }}{% else %}Error!{% endif %}</span>
    </a>

    <h1>Willkommen in deiner Finanz-App</h1>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
