<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Expense Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            max-width: 100%;
            margin: 0 auto 30px auto;
        }

        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar > div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .forms {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 33%;
        }

        .input-row label {
            font-weight: bold;
            color: #333;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 33%;
        }

        input, select, button {
            padding: 10px;
            font-size: 16px;
            width: auto;
        }

        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none;
        }

        /* Summary */
        .summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .summary-box {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 150px;
        }

        .summary-box h3 {
            margin: 0;
            font-size: 16px;
            color: #555;
        }

        .summary-box p {
            margin: 5px 0 0 0;
            font-size: 20px;
            font-weight: bold;
        }

        /* Tabelle */
        .expense-summary {
            margin-top: 30px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        /* Progress Bar */
        .progress-bar-container {
            width: 100%;
            height: 35px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 25px;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .progress-expense {
            background-color: #e74c3c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: width 0.6s ease;
        }

        .progress-saved {
            background-color: #4CAF50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: width 0.6s ease;
        }
    </style>
</head>
<body>
    <h1>Expense Planner</h1>

    <div class="container">
        <!-- Sidebar: Moduswahl & Monat/Jahr -->
        <div class="sidebar">
            <div>
                <label for="mode">Mode:</label>
                <select id="mode" onchange="switchMode()">
                    <option value="add">Add Expense</option>
                    <option value="remove">Remove Expense</option>
                </select>
            </div>

            <div>
                <label for="month">Monat:</label>
                <select id="month">
                    <option value="1">Januar</option>
                    <option value="2">Februar</option>
                    <option value="3">März</option>
                    <option value="4">April</option>
                    <option value="5">Mai</option>
                    <option value="6">Juni</option>
                    <option value="7">Juli</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">Oktober</option>
                    <option value="11">November</option>
                    <option value="12">Dezember</option>
                </select>
            </div>

            <div>
                <label for="year">Jahr:</label>
                <input type="number" id="year" value="2025" min="2000" max="2100">
            </div>
        </div>

        <!-- Forms -->
        <div class="forms">
            <!-- Input Area Überschrift für Add/Remove -->
            <div id="inputRow" class="input-row">
                <label for="amountInput">Input Area:</label>
                <input type="number" id="amountInput" name="amount" step="0.01" placeholder="Betrag (€)" required form="addForm">
            </div>

            <!-- Add Expense -->
            <form id="addForm" class="form-section">
                <input type="text" name="description" placeholder="Beschreibung" required>
                <button type="submit">Hinzufügen</button>
            </form>

            <!-- Remove Expense -->
            <div id="removeSection" class="form-section hidden">
                <label for="removeDropdown">Input Area:</label>
                <select id="removeDropdown"></select>
                <button type="button" onclick="removeExpense()">Remove Expense</button>
            </div>
        </div>
    </div>

    <!-- Expense Summary -->
    <div class="expense-summary">
        <h2 style="text-align:center;">Expense Summary</h2>
        <table id="expenseTable">
            <thead>
                <tr>
                    <th>Amount (€)</th>
                    <th>Description</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Summary Values -->
    <div class="summary">
        <div class="summary-box">
            <h3>Budget</h3>
            <p id="valBudget">0.00</p>
        </div>
        <div class="summary-box">
            <h3>Expense Sum</h3>
            <p id="valExpense">0.00</p>
        </div>
        <div class="summary-box">
            <h3>Saved</h3>
            <p id="valSaved">0.00</p>
        </div>
        <div class="summary-box">
            <h3>Expense %</h3>
            <p id="valPercentage">0.00%</p>
        </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-container">
        <div id="progressExpense" class="progress-expense">Expense: 0 €</div>
        <div id="progressSaved" class="progress-saved">Saved: 0 €</div>
    </div>

    <script>
        function getSelectedMonthYear() {
            return {
                month: parseInt(document.getElementById("month").value),
                year: parseInt(document.getElementById("year").value)
            };
        }

        function switchMode() {
            const mode = document.getElementById("mode").value;
            const addForm = document.getElementById("addForm");
            const removeSection = document.getElementById("removeSection");
            const inputRow = document.getElementById("inputRow");
            const removeLabel = removeSection.querySelector("label");

            addForm.classList.toggle("hidden", mode !== "add");
            removeSection.classList.toggle("hidden", mode !== "remove");

            // Input Area für Add oder Remove anzeigen
            inputRow.style.display = mode === "add" ? "flex" : "none";
            removeLabel.style.display = mode === "remove" ? "block" : "none";

            if (mode === "remove") loadExpensesForRemoval();
        }

        document.getElementById("addForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const { month, year } = getSelectedMonthYear();
            const today = new Date();
            const day = today.getDate();

            const formData = new FormData(this);
            formData.append("day", day);
            formData.append("month", month);
            formData.append("year", year);

            fetch("/expensePlanner/add", {
                method: "POST",
                body: new URLSearchParams(formData)
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                this.reset();
                loadExpenseSummary();
            })
            .catch(err => alert("Fehler beim Hinzufügen: " + err));
        });

        function loadExpensesForRemoval() {
            const { month, year } = getSelectedMonthYear();
            fetch(`/expensePlanner/get?month=${month}&year=${year}`)
                .then(res => res.json())
                .then(data => {
                    const dropdown = document.getElementById("removeDropdown");
                    dropdown.innerHTML = "";
                    if (data.length === 0) {
                        dropdown.innerHTML = `<option>Keine Einträge</option>`;
                        return;
                    }
                    data.forEach(row => {
                        dropdown.innerHTML += `<option value="${row.day}|${row.month}|${row.year}">${row.day}.${row.month}.${row.year} - ${row.description} (${row.amount.toFixed(2)} €)</option>`;
                    });
                });
        }

        function removeExpense() {
            const dropdown = document.getElementById("removeDropdown");
            const value = dropdown.value;
            if (!value || value === "Keine Einträge") return alert("Kein Eintrag ausgewählt!");

            fetch("/expensePlanner/remove", {
                method: "POST",
                headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: `entry=${encodeURIComponent(value)}`
            })
            .then(res => res.text())
            .then(msg => {
                alert(msg);
                loadExpensesForRemoval();
                loadExpenseSummary();
            });
        }

        function loadExpenseSummary() {
            const { month, year } = getSelectedMonthYear();
            fetch(`/expensePlanner/get?month=${month}&year=${year}`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector("#expenseTable tbody");
                    tbody.innerHTML = "";
                    if (data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3">Keine Einträge gefunden</td></tr>`;
                        return;
                    }
                    data.forEach(row => {
                        tbody.innerHTML += `<tr><td>${row.amount.toFixed(2)}</td><td>${row.description}</td><td>${row.day}.${row.month}.${row.year}</td></tr>`;
                    });
                });

            fetch(`/expensePlanner/summary?month=${month}&year=${year}`)
                .then(res => res.json())
                .then(values => {
                    document.getElementById("valBudget").textContent = values.budget.toFixed(2);
                    document.getElementById("valExpense").textContent = values.expenseSum.toFixed(2);
                    document.getElementById("valSaved").textContent = values.saved.toFixed(2);
                    document.getElementById("valPercentage").textContent = values.expensePercentage.toFixed(2) + "%";

                    const expensePct = Math.min(values.expensePercentage, 100);
                    const savedPct = 100 - expensePct;

                    const expenseDiv = document.getElementById("progressExpense");
                    const savedDiv = document.getElementById("progressSaved");

                    expenseDiv.style.width = expensePct + "%";
                    savedDiv.style.width = savedPct + "%";

                    expenseDiv.textContent = `Expense: ${values.expenseSum.toFixed(2)} €`;
                    savedDiv.textContent = `Saved: ${values.saved.toFixed(2)} €`;
                });
        }

        window.onload = function() {
            const today = new Date();
            document.getElementById("month").value = today.getMonth() + 1;
            document.getElementById("year").value = today.getFullYear();
            loadExpenseSummary();
        };
    </script>
</body>
</html>
