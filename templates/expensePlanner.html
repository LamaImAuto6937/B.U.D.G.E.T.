<!DOCTYPE html>
<html lang="de">
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-outlabels4@1.0.7/dist/chartjs-plugin-outlabels4.umd.min.js"></script>

    <meta charset="UTF-8">
    <title>Expense Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            display: flex;
            align-items: flex-start;
            gap: 40px;
            max-width: 100%;
            margin: 0 auto 30px auto;
        }
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar > div {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .forms {
            flex: 3;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 33%;
        }
        .input-row label {
            font-weight: bold;
            color: #333;
        }
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 33%;
        }
        input, select, button {
            padding: 10px;
            font-size: 16px;
            width: auto;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        #removeDropdown {
        border-radius: 8px;
        }

        #expenseChart {

            display: block;
            max-width: 700px;
            max-height: 700px;
            width: 100%;
            height: 100%;

        }

        .chart-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 520px;
        }

        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
        .summary {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .summary-box {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            min-width: 150px;
        }
        .summary-box h3 {
            margin: 0;
            font-size: 16px;
            color: #555;
        }
        .summary-box p {
            margin: 5px 0 0 0;
            font-size: 20px;
            font-weight: bold;
        }
        .expense-summary {
            margin-top: 30px;
            width: 100%;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        .progress-bar-container {
            width: 100%;
            height: 35px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 25px;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
            display: flex;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
        .progress-expense {
            background-color: #e74c3c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: width 0.6s ease;
        }
        .progress-saved {
            background-color: #4CAF50;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: width 0.6s ease;
        }
    </style>
</head>
<body>
    <h1>Expense Planner</h1>
    <div class="container">
        <div class="sidebar">
            <div>
                <label for="mode">Mode:</label>
                <select id="mode" onchange="switchMode()">
                    <option value="add">Add Expense</option>
                    <option value="remove">Remove Expense</option>
                </select>
            </div>
            <div>
                <label for="month">Monat:</label>
                <select id="month" onchange="loadExpenseSummary()">
                    <option value="1">Januar</option>
                    <option value="2">Februar</option>
                    <option value="3">März</option>
                    <option value="4">April</option>
                    <option value="5">Mai</option>
                    <option value="6">Juni</option>
                    <option value="7">Juli</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">Oktober</option>
                    <option value="11">November</option>
                    <option value="12">Dezember</option>
                </select>
            </div>
            <div>
                <label for="year">Jahr:</label>
                <input type="number" id="year" value="2025" min="2000" max="2100" onchange="loadExpenseSummary()">
            </div>
            <div>
                <label for="viewMode">Ansicht:</label>
                <select id="viewMode" onchange="switchView()">
                    <option value="table">Table View</option>
                    <option value="chart">Pie Chart View</option>
                </select>
            </div>

        </div>

        <div class="forms">
            <div id="inputRow" class="input-row">
                <label for="amountInput">Input Area:</label>
                <input type="number" id="amountInput" name="amount" step="0.01" placeholder="Betrag (€)" required form="addForm">
            </div>
            <form id="addForm" class="form-section">
                <input type="text" name="description" placeholder="Beschreibung" required>
                <button type="submit">Hinzufügen</button>
            </form>
            <div id="removeSection" class="form-section hidden">
                <label for="removeDropdown">Input Area:</label>
                <select id="removeDropdown"></select>
                <button type="button" onclick="removeExpense()">Remove Expense</button>
            </div>
        </div>
    </div>

    <div class="expense-summary">
        <h2 style="text-align:center;">Expense Summary</h2>

        <!-- TABLE VIEW (sichtbar, wenn Table View aktiv) -->
        <div id="tableView">
            <table id="expenseTable">
                <thead>
                    <tr>
                        <th>Amount (€)</th>
                        <th>Description</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- CHART VIEW (sichtbar, wenn Pie Chart View aktiv) -->
        <div id="chartView" class="hidden">
            <div class="chart-container" style="width:100%; height:520px; display:flex; justify-content:center; align-items:center;">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>
    </div>


    <div class="summary">
        <div class="summary-box">
            <h3>Budget</h3>
            <p id="valBudget">0.00</p>
        </div>
        <div class="summary-box">
            <h3>Expense Sum</h3>
            <p id="valExpense">0.00</p>
        </div>
        <div class="summary-box">
            <h3>Saved</h3>
            <p id="valSaved">0.00</p>
        </div>
        <div class="summary-box">
            <h3>Expense %</h3>
            <p id="valPercentage">0.00%</p>
        </div>
    </div>

    <div class="progress-bar-container">
        <div id="progressExpense" class="progress-expense">Expense: 0 €</div>
        <div id="progressSaved" class="progress-saved">Saved: 0 €</div>
    </div>

    <script>

        if (window.ChartDataLabels && typeof Chart.register === "function") {
            try { Chart.register(ChartDataLabels); } catch(e){/* ignore */ }
        }


        function getSelectedMonthYear() {
            return {
                month: parseInt(document.getElementById("month").value),
                year: parseInt(document.getElementById("year").value)
            };
        }
        function switchMode() {
            const mode = document.getElementById("mode").value;
            const addForm = document.getElementById("addForm");
            const removeSection = document.getElementById("removeSection");
            const inputRow = document.getElementById("inputRow");
            const removeLabel = removeSection.querySelector("label");

            addForm.classList.toggle("hidden", mode !== "add");
            removeSection.classList.toggle("hidden", mode !== "remove");
            inputRow.style.display = mode === "add" ? "flex" : "none";
            removeLabel.style.display = mode === "remove" ? "block" : "none";

            if (mode === "remove") loadExpensesForRemoval();
        }

        document.getElementById("addForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const { month, year } = getSelectedMonthYear();
            const today = new Date();
            const day = today.getDate();
            const formData = new FormData(this);

            formData.append("day", day);
            formData.append("month", month);
            formData.append("year", year);

            fetch("/expensePlanner/add", {
                method: "POST",
                body: new URLSearchParams(formData)
            })

            .then(res => res.text())
            .then(msg => {
                alert(msg);
                this.reset();
                loadExpenseSummary();
            })

            .catch(err => alert("Fehler beim Hinzufügen: " + err));
        });
        function loadExpensesForRemoval() {
            const { month, year } = getSelectedMonthYear();
            fetch(`/expensePlanner/get?month=${month}&year=${year}`)
            .then(res => res.json())
            .then(data => {
                const dropdown = document.getElementById("removeDropdown");
                dropdown.innerHTML = "";
                if (data.length === 0) {
                    dropdown.innerHTML = `<option>Keine Einträge</option>`;
                    return;
                    }
                data.forEach(row => {
                    dropdown.innerHTML += `<option value="${row.description}|${row.day}|${row.month}|${row.year}">
                        ${row.day}.${row.month}.${row.year} - ${row.description} (${row.amount.toFixed(2)} €)
                        </option>`;
                    });
            });
        }

        function removeExpense() {
            const dropdown = document.getElementById("removeDropdown");
            const value = dropdown.value;

            if (!value || value === "Keine Einträge") return alert("Kein Eintrag ausgewählt!");
            fetch("/expensePlanner/remove", {
                method: "POST",
                headers: {"Content-Type": "application/x-www-form-urlencoded"},
                body: `entry=${encodeURIComponent(value)}`
            })

            .then(res => res.text())
            .then(msg => {
                alert(msg);
                loadExpensesForRemoval();
                loadExpenseSummary();
            });
        }

        function loadExpenseSummary() {
            const { month, year } = getSelectedMonthYear();

            // 1) Tabelle laden (immer)
            fetch(`/expensePlanner/get?month=${month}&year=${year}`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector("#expenseTable tbody");
                    tbody.innerHTML = "";
                    if (!Array.isArray(data) || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3">Keine Einträge gefunden</td></tr>`;
                        return;
                    }
                    data.forEach(row => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${Number(row.amount).toFixed(2)}</td>
                                <td>${row.description}</td>
                                <td>${row.day}.${row.month}.${row.year}</td>
                            </tr>`;
                    });
                })
                .catch(err => {
                    console.error("Fehler beim Laden der Einträge:", err);
                    const tbody = document.querySelector("#expenseTable tbody");
                    tbody.innerHTML = `<tr><td colspan="3">Fehler beim Laden</td></tr>`;
                });

            // 2) Summary-Werte laden (immer)
            fetch(`/expensePlanner/summary?month=${month}&year=${year}`)
                .then(res => res.json())
                .then(values => {
                    // Falls Backend Fehler liefert, prüfe vorher
                    if (!values) return;
                    document.getElementById("valBudget").textContent = Number(values.budget || 0).toFixed(2);
                    document.getElementById("valExpense").textContent = Number(values.expenseSum || 0).toFixed(2);
                    document.getElementById("valSaved").textContent = Number(values.saved || 0).toFixed(2);
                    document.getElementById("valPercentage").textContent = (Number(values.expensePercentage || 0)).toFixed(2) + "%";

                    const expensePct = Math.min(Number(values.expensePercentage || 0), 100);
                    const savedPct = 100 - expensePct;
                    document.getElementById("progressExpense").style.width = expensePct + "%";
                    document.getElementById("progressSaved").style.width = savedPct + "%";
                    document.getElementById("progressExpense").textContent = `Expense: ${Number(values.expenseSum||0).toFixed(2)} €`;
                    document.getElementById("progressSaved").textContent = `Saved: ${Number(values.saved||0).toFixed(2)} €`;
                })
                .catch(err => {
                    console.error("Fehler beim Laden der Summary:", err);
                });

            // 3) Wenn Chart-Ansicht aktiv ist, Chart neu rendern (automatisch)
            if (document.getElementById("viewMode").value === "chart") {
                renderPieChart();
            }
        }

        window.onload = function() {
            const today = new Date();
            document.getElementById("month").value = today.getMonth() + 1;
            document.getElementById("year").value = today.getFullYear();
            loadExpenseSummary();
        };

        let expenseChartInstance = null;

        function switchView() {
            const mode = document.getElementById("viewMode").value;
            const tableView = document.getElementById("tableView");
            const chartView = document.getElementById("chartView");

            if (mode === "table") {
                // Tabelle anzeigen, ChartView komplett aus Layout nehmen
                chartView.classList.add("hidden");
                tableView.classList.remove("hidden");

                // sicherstellen, dass Tabelle befüllt wird
                loadExpenseSummary();

                // falls Chart existiert, zerstören (vermeidet Artefakte)
                if (expenseChartInstance) {
                    try { expenseChartInstance.destroy(); } catch (e) { /* ignore */ }
                    expenseChartInstance = null;
                }
            } else { // chart
                // Chart zeigen, table aus Layout nehmen
                tableView.classList.add("hidden");
                chartView.classList.remove("hidden");

                // Chart rendern (aktualisiert sich immer neu)
                renderPieChart();
            }
        }


        // robustes Register (führe das aus, nachdem die plugin-Skriptdatei geladen wurde)
        (function registerOutlabelsPlugin() {
            try {
                const candidates = [
                    window.ChartOutlabels,                // mögliche globale Namen
                    window.Outlabels,
                    window.chartjsPluginOutlabels,
                    window.chartjs_plugin_piechart_outlabels,
                    window.ChartjsPluginPiechartOutlabels,
                    window.ChartjsPluginOutlabels
                ];
                for (const pluginObj of candidates) {
                    if (pluginObj && typeof Chart.register === 'function') {
                        // pluginObj kann das Plugin selbst oder ein Objekt mit 'id' sein
                        Chart.register(pluginObj);
                        // einmal registriert -> abbrechen
                        break;
                    }
                }
            } catch (err) {
                // falls Registrierung fehlschlägt: Fehler in Konsole, aber app läuft weiter
                console.warn("Outlabels-Plugin konnte nicht registriert werden:", err);
            }
        })();


        function renderPieChart() {
            const { month, year } = getSelectedMonthYear();

            Promise.all([
                fetch(`/expensePlanner/summary?month=${month}&year=${year}`).then(r => r.json()),
                fetch(`/expensePlanner/get?month=${month}&year=${year}`).then(r => r.json())
            ])
            .then(([summary, expenses]) => {
                if (expenseChartInstance) {
                    try { expenseChartInstance.destroy(); } catch(e){}
                    expenseChartInstance = null;
                }

                if (!summary || (Number(summary.expenseSum) === 0 && Number(summary.saved) === 0)) {
                    alert("Keine Daten für dieses Diagramm!");
                    return;
                }

                const ctx = document.getElementById("expenseChart").getContext("2d");

                // Daten für inneren Ring (Saved vs Expense Sum)
                const innerData = [Number(summary.saved || 0), Number(summary.expenseSum || 0)];
                const innerColors = ["#2ecc71", "#e74c3c"];

                // Daten für äußeren Ring (Saved + Details)
                const outerLabels = ["Saved", ...(expenses.map(e => e.description))];
                const outerData = [Number(summary.saved || 0), ...expenses.map(e => Number(e.amount || 0))];

                const palette = ["#e74c3c","#3498db","#9b59b6","#f1c40f","#1abc9c","#e67e22","#34495e","#7f8c8d"];
                const outerColors = [
                    "#2ecc71",
                    ...expenses.map((_, i) => palette[i % palette.length])
                ];

                expenseChartInstance = new Chart(ctx, {
                    type: "doughnut",
                    data: {
                        labels: outerLabels,
                        datasets: [
                            {
                                label: "Overview",
                                data: innerData,
                                backgroundColor: innerColors,
                                radius: "60%",
                                outLabels: { display: false } // keine Labels im inneren Ring
                            },
                            {
                                label: "Details",
                                data: outerData,
                                backgroundColor: outerColors,
                                radius: "90%",
                                cutout: "60%",
                                outLabels: {
                                    display: ctx => Number(ctx.dataset.data[ctx.dataIndex]) > 0,
                                    formatter: (value, ctx) => {
                                        return ctx.chart.data.labels[ctx.dataIndex] || "";
                                    },
                                    anchor: "end",
                                    align: "end",
                                    offset: 8,
                                    color: "#000",
                                    font: { weight: "600", size: 12 },
                                    clamp: true
                                }
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: {
                            padding: { top: 40, bottom: 40, left: 40, right: 40 }
                        },
                        plugins: {
                            outlabels: {
                                text: "%l %v€",
                                color: "black",
                                stretch: 30,
                                lineWidth: 2,
                                font: {
                                    resizable: true,
                                    minSize: 12,
                                    maxSize: 14
                                }
                            }
                        }
                    }
                });
            })
            .catch(err => {
                console.error("Fehler beim Laden der Chart-Daten:", err);
                alert("Fehler beim Laden der Chart-Daten (Konsole prüfen).");
            });
        }


    </script>
</body>
</html>
