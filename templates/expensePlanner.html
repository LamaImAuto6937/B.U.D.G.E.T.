<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/expensePlanner.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">

  <title>B.U.D.G.E.T. – Expense Planner</title>
  
</head>
<body>

<!--NAVIGATION BAR-->
{% include 'components/navbar.html' %}

<!-- BUDGET HERO CARD -->
<div class="budget-section">
  <div class="budget-card">
    <div class="budget-card-header">
      <div>
        <div class="label">Budget</div>
        <div class="budget-amount" id="budgetAmount">0,00 €</div>
      </div>
      <button class="month-picker-btn" id="monthPickerBtn">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="monthPickerLabel">März 2026</span>
        <svg viewBox="0 0 24 24" style="width:10px;height:10px;stroke:var(--text-muted);fill:none;stroke-width:2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>

    <div class="budget-stats">
      <div class="budget-stat">
        <div class="stat-label">Ausgaben</div>
        <div class="stat-value negative" id="statExpenses">–</div>
      </div>
      <div class="budget-stat">
        <div class="stat-label">Bilanz</div>
        <div class="stat-value" id="statBalance">–</div>
      </div>
      <div class="budget-stat">
        <div class="stat-label">Verfügbar</div>
        <div class="stat-value positive" id="statAvailable">–</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressLabel">0 % ausgegeben</span>
        <span id="progressRemaining">–</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </div>
</div>

<!-- Month Popover -->
<div class="month-popover" id="monthPopover">
  <div class="popover-year-nav">
    <button class="year-btn" id="prevYear">&#8249;</button>
    <span id="popoverYear">2026</span>
    <button class="year-btn" id="nextYear">&#8250;</button>
  </div>
  <div class="months-grid" id="monthsGrid"></div>
</div>

<!-- ENTRIES -->
<div class="entries-section">
  <h2 id="entriesLabel">Einträge</h2>
  <div id="entriesList"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn">+</button>

<!-- CONTEXT MENU -->
<div class="context-menu" id="contextMenu">
  <div class="context-menu-item" id="ctxEdit"><span>✏️</span> Bearbeiten</div>
  <div class="context-menu-item danger" id="ctxDelete"><span>🗑️</span> Löschen</div>
</div>

<!-- DIALOG -->
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog">
    <h3 id="dialogTitle">Neuer Eintrag</h3>
    <div class="dialog-field">
      <label>Beschreibung</label>
      <input type="text" id="inputDesc" placeholder="z. B. Supermarkt, Gehalt…" />
    </div>
    <div class="dialog-field">
      <label>Betrag (€)</label>
      <input type="number" id="inputAmount" placeholder="0.00" step="0.01" />
    </div>
    <div class="dialog-field">
      <label>Typ</label>
      <select id="inputType">
        <option value="expense">Ausgabe</option>
        <option value="income">Einnahme</option>
      </select>
    </div>
    <div class="dialog-actions">
      <button class="btn-cancel" id="dialogCancel">Abbrechen</button>
      <button class="btn-save" id="dialogSave">Speichern</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/expensePlanner.js') }}"></script>

</body>
</html>
