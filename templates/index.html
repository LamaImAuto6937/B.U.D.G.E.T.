<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Finanz-App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
            text-align: center;
            position: relative;
            padding-top: 60px; /* Platz für die feste Navbar */
        }

        h1 {
            color: #333;
        }

        /* NAV BAR */

        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 1000;
        }

        .nav-title {
            font-size: 22px;
            font-weight: bold;
            color: #2C3E50;
        }

        .custom-nav {
            display: flex;
            gap: 25px;
            flex: 1;
            justify-content: center;
            margin-left: 40px;
            margin-right: 40px;
        }

        .nav-item {
            font-size: 17px;
            padding: 8px 10px;
            text-decoration: none;
            color: #333;
            border-bottom: 3px solid transparent;
            transition: all 0.25s ease;
        }

        .nav-item:hover {
            border-bottom: 3px solid #3498db;
            color: #3498db;
        }

        .nav-item.active {
            border-bottom: 3px solid #3498db;
            color: #3498db;
            font-weight: bold;
        }

        .nav-btn.logout {
            background: #e74c3c;
            color: white;
            padding: 10px 14px;
            margin-right: 50px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.2s ease;
        }

        .nav-btn.logout:hover {
            background: #c0392b;
        }

    </style>
</head>
<body>

    <div class="top-nav">

        <!-- Logo / Titel -->
        <div class="nav-title">Finanz-App</div>

        <!-- Module -->
        <nav class="custom-nav">
            <a href="/" class="nav-item active"> Dashboard</a>
            <a href="/monthlyBudget" class="nav-item">📊 Monthly Budget Planner</a>
            <a href="/expensePlanner" class="nav-item">💸 Expense Planner</a>
        </nav>

        <!-- Logout -->
        <div>
            <a href="/logout" class="nav-btn logout">Log-Out</a>
        </div>

    </div>

    <h1>Willkommen in deiner Finanz-App</h1>

</body>
</html>
